<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay on Track</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <main class="container">
        <header class="hero">
            <div class="logo">
                <span class="logo-icon">📌</span>
                <h1>Stay on <span class="highlight">Track</span></h1>
            </div>
            <p class="tagline">Track anything — school, work, life 💖</p>
        </header>

        <section class="stats-grid" id="stats"></section>

        <section class="main-content">
            <aside class="sidebar card">
                <h2>➕ Add Item</h2>
                <form id="app-form">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="e.g. Math homework" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Column</label>
                        <select id="status"></select>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="3" placeholder="Details, links, reminders..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">💾 Add Item</button>
                    <button type="button" class="btn btn-secondary hidden" id="cancel-edit">Cancel Edit</button>
                </form>
            </aside>

            <section class="board card">
                <div class="board-header">
                    <h2>🗂 Your Board</h2>
                    <button type="button" class="btn-settings" id="open-settings">⚙️ Customize Columns</button>
                </div>

                <div id="search-bar">
                    <input type="text" id="search" placeholder="🔍 Search items...">
                </div>

                <div id="board" class="board-columns"></div>
            </section>
        </section>

        <footer class="footer">
            <p>Stay on Track 💜 — Made with 💛 by Sandisiwe Ngcuka </p>
        </footer>
    </main>

    <div class="modal" id="settings-modal">
        <div class="modal-content card">
            <div class="modal-header">
                <h2>⚙️ Customize Your Board</h2>
                <button type="button" class="modal-close" id="close-settings">✕</button>
            </div>
            <p class="modal-hint">Add, rename, or remove your columns. Cards can be moved between columns by dragging or using the ▸ button.</p>
            <div id="columns-editor"></div>
            <button type="button" class="btn btn-primary" id="add-column">＋ Add Column</button>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="done-settings">Done</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>
    <script src="script.js"></script>
</body>

</html>
